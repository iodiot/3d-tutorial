<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="coarse" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M15 0H0V15" fill="none" stroke="#2c3242" stroke-width="1"/></pattern>
    <pattern id="fine" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="#252a38" stroke-width="1"/></pattern>
    <g id="fox"><ellipse cx="-62" cy="0" rx="26" ry="9" fill="#c9773a"/><ellipse cx="0" cy="0" rx="42" ry="15" fill="#e08a3c"/><path d="M34 -10L70 0L34 10Z" fill="#e08a3c"/><path d="M42 -9L50 -20L54 -6ZM42 9L50 20L54 6Z" fill="#e08a3c"/><circle cx="-86" cy="0" r="5" fill="#f4f1ea"/></g>
  </defs>
  <rect width="880" height="480" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">FITTING THE SHADOW CAMERA (SEEN FROM THE LIGHT)</text>
  <!-- left -->
  <text x="60" y="84" fill="#ff7a85" font-size="14" font-weight="600">Default: ±5 units, mapSize 512</text>
  <rect x="60" y="100" width="300" height="300" fill="url(#coarse)" stroke="#ff7a85" stroke-width="2" stroke-dasharray="6 5"/>
  <g transform="translate(210 250) scale(0.42)"><use href="#fox"/></g>
  <text x="60" y="424" fill="#9aa3b5" font-size="12">10 units / 512 texels ≈ 0.0195 units per texel</text>
  <text x="60" y="442" fill="#9aa3b5" font-size="12">the 2-unit fox gets about 100 texels end to end</text>
  <!-- right -->
  <text x="480" y="84" fill="#7cf5d4" font-size="14" font-weight="600">Fitted: ±1.6 units, mapSize 1024</text>
  <rect x="480" y="100" width="300" height="300" fill="url(#fine)" stroke="#7cf5d4" stroke-width="2"/>
  <g transform="translate(630 250) scale(1.3)"><use href="#fox"/></g>
  <text x="480" y="424" fill="#9aa3b5" font-size="12">3.2 units / 1024 texels ≈ 0.0031 units per texel</text>
  <text x="480" y="442" fill="#9aa3b5" font-size="12">the same fox gets about 640 texels: six times sharper</text>
  <path d="M380 250H460" stroke="#6b7386" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="420" y="240" fill="#6b7386" font-size="12" text-anchor="middle">shrink</text>
  <text x="60" y="466" fill="#6b7386" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">CameraHelper(sun.shadow.camera) draws this box</text>
</svg>
