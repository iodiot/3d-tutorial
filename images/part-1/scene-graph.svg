<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7386"/></marker>
  </defs>
  <rect width="880" height="470" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">THE SCENE GRAPH</text>
  <g stroke="#3a4258" stroke-width="2" fill="none">
    <path d="M330 118V150H120V182"/><path d="M330 150H310V182"/><path d="M330 150H520V182"/><path d="M330 118V150"/>
    <path d="M120 234V266H60V298"/><path d="M120 266H190V298"/>
  </g>
  <!-- Scene -->
  <rect x="250" y="70" width="160" height="48" rx="12" fill="#0f2a24" stroke="#7cf5d4" stroke-width="2"/>
  <text x="330" y="100" fill="#e7eaf0" font-size="17" font-weight="600" text-anchor="middle">Scene</text>
  <!-- children -->
  <rect x="50" y="182" width="140" height="52" rx="12" fill="#171b25" stroke="#7aa7ff" stroke-width="2"/>
  <text x="120" y="206" fill="#e7eaf0" font-size="16" font-weight="600" text-anchor="middle">Mesh</text>
  <text x="120" y="225" fill="#9aa3b5" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">cube</text>
  <rect x="230" y="182" width="160" height="52" rx="12" fill="#171b25" stroke="#f2cc60" stroke-width="2"/>
  <text x="310" y="206" fill="#e7eaf0" font-size="16" font-weight="600" text-anchor="middle">AmbientLight</text>
  <text x="310" y="225" fill="#9aa3b5" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">ambient</text>
  <rect x="430" y="182" width="180" height="52" rx="12" fill="#171b25" stroke="#f2cc60" stroke-width="2"/>
  <text x="520" y="206" fill="#e7eaf0" font-size="16" font-weight="600" text-anchor="middle">DirectionalLight</text>
  <text x="520" y="225" fill="#9aa3b5" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">sun</text>
  <!-- mesh parts -->
  <rect x="10" y="298" width="110" height="48" rx="10" fill="#12151d" stroke="#3a4258" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="65" y="319" fill="#e7eaf0" font-size="13" text-anchor="middle">BoxGeometry</text>
  <text x="65" y="336" fill="#9aa3b5" font-size="11" text-anchor="middle">the shape</text>
  <rect x="130" y="298" width="150" height="48" rx="10" fill="#12151d" stroke="#3a4258" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="205" y="319" fill="#e7eaf0" font-size="13" text-anchor="middle">MeshStandardMaterial</text>
  <text x="205" y="336" fill="#9aa3b5" font-size="11" text-anchor="middle">the surface</text>
  <text x="32" y="384" fill="#6b7386" font-size="12">Geometry and material are not children: a Mesh just references them,</text>
  <text x="32" y="401" fill="#6b7386" font-size="12">so many meshes can share one geometry or material.</text>
  <!-- camera + render -->
  <rect x="680" y="70" width="170" height="48" rx="12" fill="#171b25" stroke="#c79bff" stroke-width="2"/>
  <text x="765" y="100" fill="#e7eaf0" font-size="16" font-weight="600" text-anchor="middle">PerspectiveCamera</text>
  <text x="765" y="140" fill="#9aa3b5" font-size="12" text-anchor="middle">may live outside the scene</text>
  <rect x="660" y="300" width="200" height="60" rx="12" fill="#0e1118" stroke="#7cf5d4" stroke-width="1.5"/>
  <text x="760" y="326" fill="#7cf5d4" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">renderer.render(</text>
  <text x="760" y="346" fill="#7cf5d4" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">scene, camera)</text>
  <path d="M410 94H636V318H652" stroke="#6b7386" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M765 152V292" stroke="#6b7386" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="660" y="392" width="200" height="44" rx="10" fill="#171b25" stroke="#3a4258"/>
  <text x="760" y="419" fill="#e7eaf0" font-size="14" text-anchor="middle">pixels on a &lt;canvas&gt;</text>
  <path d="M760 360V386" stroke="#6b7386" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
