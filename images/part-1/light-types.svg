<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <radialGradient id="pt" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2cc60" stop-opacity=".55"/><stop offset="1" stop-color="#f2cc60" stop-opacity="0"/></radialGradient>
    <linearGradient id="hemi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa7ff" stop-opacity=".45"/><stop offset="1" stop-color="#8a6a3a" stop-opacity=".45"/></linearGradient>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2cc60"/></marker>
  </defs>
  <rect width="1000" height="330" rx="18" fill="#12151d"/>
  <text x="28" y="40" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">COMMON LIGHT TYPES</text>
  <g font-size="12" fill="#9aa3b5" text-anchor="middle">
    <!-- panels -->
    <g transform="translate(20 60)">
      <rect width="180" height="250" rx="12" fill="#171b25" stroke="#232838"/>
      <rect x="20" y="20" width="140" height="120" rx="8" fill="#f2cc60" fill-opacity=".12"/>
      <circle cx="90" cy="80" r="26" fill="#2c9a7f"/>
      <text x="90" y="170" fill="#e7eaf0" font-size="15" font-weight="600">AmbientLight</text>
      <text x="90" y="192">same light everywhere,</text><text x="90" y="208">no direction, no shading</text>
      <text x="90" y="232" fill="#6b7386">fills the dark side</text>
    </g>
    <g transform="translate(215 60)">
      <rect width="180" height="250" rx="12" fill="#171b25" stroke="#232838"/>
      <rect x="20" y="20" width="140" height="120" rx="8" fill="url(#hemi)"/>
      <circle cx="90" cy="80" r="26" fill="#2c9a7f"/>
      <path d="M64 80A26 26 0 0 1 116 80Z" fill="#5fb6c6" fill-opacity=".55"/>
      <text x="90" y="170" fill="#e7eaf0" font-size="15" font-weight="600">HemisphereLight</text>
      <text x="90" y="192">sky colour from above,</text><text x="90" y="208">ground colour from below</text>
      <text x="90" y="232" fill="#6b7386">cheap outdoor fill</text>
    </g>
    <g transform="translate(410 60)">
      <rect width="180" height="250" rx="12" fill="#171b25" stroke="#232838"/>
      <g stroke="#f2cc60" stroke-width="2" marker-end="url(#r)"><path d="M30 26L62 58"/><path d="M58 22L90 54"/><path d="M86 18L118 50"/></g>
      <circle cx="96" cy="94" r="26" fill="#14503f"/>
      <path d="M70 94A26 26 0 0 1 96 68A26 26 0 0 1 122 94A30 30 0 0 0 70 94Z" fill="#46c9a8" transform="rotate(-40 96 94)"/>
      <text x="90" y="170" fill="#e7eaf0" font-size="15" font-weight="600">DirectionalLight</text>
      <text x="90" y="192">parallel rays from</text><text x="90" y="208">one direction, like the sun</text>
      <text x="90" y="232" fill="#6b7386">used in this article</text>
    </g>
    <g transform="translate(605 60)">
      <rect width="180" height="250" rx="12" fill="#171b25" stroke="#232838"/>
      <circle cx="56" cy="56" r="44" fill="url(#pt)"/>
      <circle cx="56" cy="56" r="6" fill="#f2cc60"/>
      <circle cx="112" cy="102" r="26" fill="#14503f"/>
      <path d="M86 102A26 26 0 0 1 112 76A26 26 0 0 1 138 102A30 30 0 0 0 86 102Z" fill="#46c9a8" transform="rotate(-45 112 102)"/>
      <text x="90" y="170" fill="#e7eaf0" font-size="15" font-weight="600">PointLight</text>
      <text x="90" y="192">light in all directions</text><text x="90" y="208">from one point, fades out</text>
      <text x="90" y="232" fill="#6b7386">a light bulb</text>
    </g>
    <g transform="translate(800 60)">
      <rect width="180" height="250" rx="12" fill="#171b25" stroke="#232838"/>
      <path d="M90 26L44 132L136 132Z" fill="#f2cc60" fill-opacity=".14"/>
      <path d="M90 26L44 132M90 26L136 132" stroke="#f2cc60" stroke-opacity=".6"/>
      <circle cx="90" cy="26" r="6" fill="#f2cc60"/>
      <ellipse cx="90" cy="132" rx="46" ry="8" fill="#f2cc60" fill-opacity=".3"/>
      <text x="90" y="170" fill="#e7eaf0" font-size="15" font-weight="600">SpotLight</text>
      <text x="90" y="192">a cone from a point,</text><text x="90" y="208">with angle and soft edge</text>
      <text x="90" y="232" fill="#6b7386">a flashlight, a stage light</text>
    </g>
  </g>
</svg>
