<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker><marker id="gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker></defs>
  <rect width="940" height="410" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">COMPUTE: THE GPU SIMULATES, THE GPU DRAWS</text>
  <rect x="32" y="100" width="252" height="190" rx="12" fill="#1b2030"  stroke="#7cf5d4" stroke-width="2" />
  <text x="50" y="126" fill="#7cf5d4" font-size="15" font-weight="700" >JavaScript (CPU)</text>
  <text x="50" y="150" fill="#9aa3b5" font-size="11.5"  >per frame, only:</text>
  <text x="50" y="168" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >dt.value = …</text>
  <text x="50" y="186" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >attractor.value = …</text>
  <text x="50" y="204" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >renderer.compute(update)</text>
  <text x="50" y="222" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >renderer.render(scene, camera)</text>
  <rect x="306" y="72" width="606" height="262" rx="16" fill="none" stroke="#6b7386" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="324" y="94" fill="#6b7386" font-size="12"   font-weight="700">GPU</text>
  <rect x="326" y="110" width="176" height="180" rx="12" fill="#1b2030"  stroke="#7cf5d4" stroke-width="2" />
  <text x="344" y="136" fill="#7cf5d4" font-size="15" font-weight="700" >compute pass</text>
  <text x="344" y="160" fill="#9aa3b5" font-size="11.5"  >one thread per</text>
  <text x="344" y="177" fill="#9aa3b5" font-size="11.5"  >particle, in parallel:</text>
  <text x="344" y="194" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="344" y="211" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >instanceIndex</text>
  <text x="344" y="228" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >  = 0…N-1</text>
  <text x="344" y="245" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="344" y="262" fill="#9aa3b5" font-size="11.5"  >velocity += force · dt</text>
  <text x="344" y="279" fill="#9aa3b5" font-size="11.5"  >position += velocity · dt</text>
  <rect x="530" y="110" width="176" height="180" rx="12" fill="#1b2030"  stroke="#f2cc60" stroke-width="2" />
  <text x="548" y="136" fill="#f2cc60" font-size="15" font-weight="700" >storage buffers</text>
  <text x="548" y="160" fill="#9aa3b5" font-size="11.5"  >stay in GPU memory</text>
  <text x="548" y="177" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="548" y="194" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >positions  vec3 × N</text>
  <text x="548" y="211" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >velocities vec3 × N</text>
  <text x="548" y="228" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="548" y="245" fill="#9aa3b5" font-size="11.5"  >nothing is copied back</text>
  <text x="548" y="262" fill="#9aa3b5" font-size="11.5"  >to JavaScript</text>
  <rect x="734" y="110" width="160" height="180" rx="12" fill="#1b2030"  stroke="#c79bff" stroke-width="2" />
  <text x="752" y="136" fill="#c79bff" font-size="15" font-weight="700" >render pass</text>
  <text x="752" y="160" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >Sprite.count = N</text>
  <text x="752" y="177" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="752" y="194" fill="#9aa3b5" font-size="11.5"  >SpriteNodeMaterial:</text>
  <text x="752" y="211" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >positionNode =</text>
  <text x="752" y="228" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >  positions</text>
  <text x="752" y="245" fill="#e7eaf0" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace" >  .toAttribute()</text>
  <text x="752" y="262" fill="#9aa3b5" font-size="11.5"  ></text>
  <text x="752" y="279" fill="#9aa3b5" font-size="11.5"  >draws N quads</text>
  <path d="M502 200H530" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" marker-start="url(#gs)"/>
  <path d="M706 200H734" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <path d="M284 150H326" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <text x="290" y="142" fill="#7cf5d4" font-size="14"   font-weight="700">1</text>
  <path d="M158 290V366H814V290" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <text x="168" y="358" fill="#c79bff" font-size="14"   font-weight="700">2</text>
  <text x="32" y="396" fill="#6b7386" font-size="12"   >Every frame: compute first, then render. 40,000 particles cost the same CPU work as four.</text>
</svg>
