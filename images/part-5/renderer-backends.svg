<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker><marker id="gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker></defs>
  <rect width="880" height="400" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">ONE RENDERER, TWO BACKENDS</text>
  <rect x="32" y="100" width="230" height="150" rx="12" fill="#1b2030"  stroke="#7cf5d4" stroke-width="2" />
  <text x="50" y="126" fill="#7cf5d4" font-size="15" font-weight="700" >Your code</text>
  <text x="50" y="150" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" >const renderer =</text>
  <text x="50" y="168" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" >  new WebGPURenderer();</text>
  <text x="50" y="186" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" >await renderer.init();</text>
  <text x="50" y="204" fill="#9aa3b5" font-size="12"  ></text>
  <text x="50" y="222" fill="#9aa3b5" font-size="12"  >the same on every browser</text>
  <path d="M262 175H322" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <rect x="328" y="80" width="240" height="190" rx="12" fill="#1b2030"  stroke="#6cb6ff" stroke-width="2" />
  <text x="346" y="106" fill="#6cb6ff" font-size="15" font-weight="700" >init() asks the browser</text>
  <text x="346" y="130" fill="#9aa3b5" font-size="12"  >1. is there a navigator.gpu?</text>
  <text x="346" y="148" fill="#9aa3b5" font-size="12"  >2. does requestAdapter()</text>
  <text x="346" y="166" fill="#9aa3b5" font-size="12"  >    find a GPU?</text>
  <text x="346" y="184" fill="#9aa3b5" font-size="12"  >3. does requestDevice()</text>
  <text x="346" y="202" fill="#9aa3b5" font-size="12"  >    give us a device?</text>
  <path d="M568 140L644 108" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <text x="576" y="112" fill="#c79bff" font-size="12"   >all yes</text>
  <path d="M568 210L644 242" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <text x="576" y="252" fill="#f2cc60" font-size="12"   >any no</text>
  <rect x="650" y="64" width="200" height="92" rx="12" fill="#1b2030"  stroke="#c79bff" stroke-width="2" />
  <text x="668" y="90" fill="#c79bff" font-size="15" font-weight="700" >WebGPU backend</text>
  <text x="668" y="114" fill="#9aa3b5" font-size="12"  >TSL compiles to WGSL</text>
  <text x="668" y="132" fill="#9aa3b5" font-size="12"  >compute shaders: native</text>
  <rect x="650" y="208" width="200" height="92" rx="12" fill="#1b2030"  stroke="#f2cc60" stroke-width="2" />
  <text x="668" y="234" fill="#f2cc60" font-size="15" font-weight="700" >WebGL 2 backend</text>
  <text x="668" y="258" fill="#9aa3b5" font-size="12"  >TSL compiles to GLSL ES 3.0</text>
  <text x="668" y="276" fill="#9aa3b5" font-size="12"  >compute: emulated, slower</text>
  <text x="650" y="326" fill="#ff7a7a" font-size="12"   >no WebGL 2 either: init() rejects,</text>
  <text x="650" y="344" fill="#ff7a7a" font-size="12"   >so catch it and show a message</text>
  <text x="32" y="376" fill="#6b7386" font-size="12"   >renderer.backend.isWebGPUBackend tells you which one you got. Same scene, same materials, same TSL.</text>
</svg>
