<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker><marker id="gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker></defs>
  <rect width="880" height="430" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">WHERE NODES PLUG INTO A NODE MATERIAL</text>
  <rect x="32" y="80" width="240" height="250" rx="12" fill="#1b2030"  stroke="#c79bff" stroke-width="2" />
  <text x="50" y="106" fill="#c79bff" font-size="15" font-weight="700" >Vertex stage</text>
  <text x="50" y="130" fill="#9aa3b5" font-size="12"  >runs once per vertex</text>
  <rect x="52" y="150" width="200" height="64" rx="10" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="66" y="174" fill="#e7eaf0" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">positionNode</text>
  <text x="66" y="194" fill="#9aa3b5" font-size="12"   >where each vertex ends up</text>
  <text x="52" y="250" fill="#9aa3b5" font-size="12"   >Step 4: lift the water plane</text>
  <text x="52" y="268" fill="#9aa3b5" font-size="12"   >Step 5: push the orb outward</text>
  <rect x="310" y="150" width="170" height="120" rx="12" fill="#1b2030" fill-opacity="1" stroke="#6cb6ff" stroke-width="1.5" />
  <text x="395" y="184" fill="#e7eaf0" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">varying(node)</text>
  <text x="395" y="208" fill="#9aa3b5" font-size="12"  text-anchor="middle" >a value computed per vertex,</text>
  <text x="395" y="226" fill="#9aa3b5" font-size="12"  text-anchor="middle" >blended across each triangle,</text>
  <text x="395" y="244" fill="#9aa3b5" font-size="12"  text-anchor="middle" >read per pixel</text>
  <path d="M252 182H310" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <path d="M480 210H538" fill="none" stroke="#9aa3b5" stroke-width="1.5"  marker-end="url(#g)" />
  <rect x="544" y="80" width="304" height="312" rx="12" fill="#1b2030"  stroke="#7cf5d4" stroke-width="2" />
  <text x="562" y="106" fill="#7cf5d4" font-size="15" font-weight="700" >Fragment stage</text>
  <text x="562" y="130" fill="#9aa3b5" font-size="12"  >runs once per pixel</text>
  <rect x="564" y="140" width="264" height="40" rx="8" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="576" y="157" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">colorNode</text>
  <text x="576" y="172" fill="#9aa3b5" font-size="11"   >base colour (like color + map)</text>
  <rect x="564" y="188" width="264" height="40" rx="8" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="576" y="205" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">normalNode</text>
  <text x="576" y="220" fill="#9aa3b5" font-size="11"   >normal used by the lighting</text>
  <rect x="564" y="236" width="264" height="40" rx="8" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="576" y="253" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">emissiveNode</text>
  <text x="576" y="268" fill="#9aa3b5" font-size="11"   >light added on top: glow, rims</text>
  <rect x="564" y="284" width="264" height="40" rx="8" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="576" y="301" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">roughnessNode, metalnessNode</text>
  <text x="576" y="316" fill="#9aa3b5" font-size="11"   >surface response, per pixel</text>
  <rect x="564" y="332" width="264" height="40" rx="8" fill="#1b2030"  stroke="#1b2030" stroke-width="1.5" />
  <text x="576" y="349" fill="#e7eaf0" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace"  font-weight="700">opacityNode</text>
  <text x="576" y="364" fill="#9aa3b5" font-size="11"   >how see-through, per pixel</text>
  <text x="32" y="410" fill="#6b7386" font-size="12"   >MeshStandardNodeMaterial shown. Each slot is optional: leave it empty and the material behaves as in Part 3.</text>
</svg>
