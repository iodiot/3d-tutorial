  <text x="32" y="368" fill="#6fd8ff" font-size="12" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">  if (!pending) { pending = true; requestAnimationFrame(render); }</text>
  <text x="32" y="387" fill="#6fd8ff" font-size="12" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">}</text>
