<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7cf5d4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6fae"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6fd8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb35c"/></marker></defs>
  <rect width="900" height="480" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">WHERE A FRAME GOES</text>
  <text x="170" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">0 ms</text>
  <text x="242" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">2 ms</text>
  <text x="314" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">4 ms</text>
  <text x="386" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">6 ms</text>
  <text x="458" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">8 ms</text>
  <text x="530" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">10 ms</text>
  <text x="602" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">12 ms</text>
  <text x="674" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">14 ms</text>
  <text x="746" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">16 ms</text>
  <text x="818" y="80" fill="#6b7386" font-size="10" font-weight="400" text-anchor="middle">18 ms</text>
  <line x1="771.1999999999999" y1="88" x2="771.1999999999999" y2="410" stroke="#ff6fae" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="771.1999999999999" y="425" fill="#ff6fae" font-size="11" font-weight="700" text-anchor="middle">16.7 ms = 60 fps</text>
  <text x="32" y="118" fill="#7cf5d4" font-size="14" font-weight="700" text-anchor="start">balanced</text>
  <text x="32" y="136" fill="#9aa3b5" font-size="11" font-weight="400" text-anchor="start">both finish early</text>
  <text x="160" y="115" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">CPU</text>
  <text x="160" y="143" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">GPU</text>
  <rect x="170" y="102" width="106" height="20" rx="5" fill="#7cf5d4" opacity="0.85"/>
  <text x="178" y="116" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">JS</text>
  <rect x="278" y="102" width="70" height="20" rx="5" fill="#6fd8ff" opacity="0.85"/>
  <text x="286" y="116" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">draws</text>
  <rect x="323" y="130" width="178" height="20" rx="5" fill="#a98bff" opacity="0.85"/>
  <text x="331" y="144" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">raster</text>
  <text x="170" y="172" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">CPU and GPU both finish well inside the budget: the frame waits for the next display refresh.</text>
  <text x="32" y="218" fill="#ffb35c" font-size="14" font-weight="700" text-anchor="start">CPU-bound</text>
  <text x="32" y="236" fill="#9aa3b5" font-size="11" font-weight="400" text-anchor="start">too many draw calls</text>
  <text x="160" y="215" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">CPU</text>
  <text x="160" y="243" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">GPU</text>
  <rect x="170" y="202" width="106" height="20" rx="5" fill="#7cf5d4" opacity="0.85"/>
  <text x="178" y="216" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">JS</text>
  <rect x="278" y="202" width="502" height="20" rx="5" fill="#6fd8ff" opacity="0.85"/>
  <text x="286" y="216" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">4,000 draw calls</text>
  <rect x="690.1999999999999" y="230" width="106" height="20" rx="5" fill="#a98bff" opacity="0.85"/>
  <text x="170" y="272" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">The GPU sits idle while the CPU issues draws. A smaller canvas does not help; fewer draw calls (instancing, batching) do.</text>
  <text x="32" y="318" fill="#ff6fae" font-size="14" font-weight="700" text-anchor="start">GPU-bound</text>
  <text x="32" y="336" fill="#9aa3b5" font-size="11" font-weight="400" text-anchor="start">too many pixels</text>
  <text x="160" y="315" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">CPU</text>
  <text x="160" y="343" fill="#6b7386" font-size="10" font-weight="400" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">GPU</text>
  <rect x="170" y="302" width="70" height="20" rx="5" fill="#7cf5d4" opacity="0.85"/>
  <text x="178" y="316" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">JS</text>
  <rect x="242" y="302" width="34" height="20" rx="5" fill="#6fd8ff" opacity="0.85"/>
  <rect x="261.8" y="330" width="610" height="20" rx="5" fill="#a98bff" opacity="0.85"/>
  <text x="269.8" y="344" fill="#0d1017" font-size="11" font-weight="700" text-anchor="start">pixels × shading × shadow passes</text>
  <text x="170" y="372" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">The CPU is done early and waits. Lower pixel ratio, shadow map size or overdraw; fewer draw calls barely help.</text>
  <text x="32" y="452" fill="#e7eaf0" font-size="12.5" font-weight="400" text-anchor="start">Test: halve the pixel ratio. If the frame gets much faster, you are GPU-bound. If nothing changes, look at the CPU (JS and draw calls).</text>

</svg>
