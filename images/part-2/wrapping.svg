<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <g id="tile">
      <rect width="60" height="60" fill="#2c9a7f"/>
      <path d="M18 48V14H40M18 30H34" stroke="#12151d" stroke-width="6" fill="none" stroke-linecap="square"/>
      <rect width="60" height="7" fill="#f2cc60"/><rect x="53" width="7" height="60" fill="#7aa7ff"/>
    </g>
    <g id="mx"><use href="#tile" transform="matrix(-1 0 0 1 60 0)"/></g>
    <g id="my"><use href="#tile" transform="matrix(1 0 0 -1 0 60)"/></g>
    <g id="mxy"><use href="#tile" transform="matrix(-1 0 0 -1 60 60)"/></g>
  </defs>
  <rect width="880" height="340" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">TEXTURE.REPEAT.SET(3, 2) WITH EACH WRAP MODE</text>
  <!-- clamp: first tile shows image, rest smeared edge -->
  <g transform="translate(40 90)">
    <use href="#tile" y="60"/>
    <rect width="53" height="60" fill="#f2cc60"/><rect x="53" width="127" height="60" fill="#7aa7ff"/>
    <rect x="60" y="60" width="120" height="60" fill="#7aa7ff"/>
    <path d="M60 0V120M0 60H180" stroke="#12151d" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".5"/>
    <rect width="180" height="120" fill="none" stroke="#e7eaf0" stroke-width="1.5"/>
    <text x="90" y="150" fill="#e7eaf0" font-size="14" font-weight="600" text-anchor="middle">ClampToEdgeWrapping</text>
    <text x="90" y="170" fill="#9aa3b5" font-size="12" text-anchor="middle">the default: the last row and</text>
    <text x="90" y="186" fill="#9aa3b5" font-size="12" text-anchor="middle">column are stretched outwards</text>
  </g>
  <g transform="translate(350 90)">
    <use href="#tile"/><use href="#tile" x="60"/><use href="#tile" x="120"/>
    <use href="#tile" y="60"/><use href="#tile" x="60" y="60"/><use href="#tile" x="120" y="60"/>
    <path d="M60 0V120M120 0V120M0 60H180" stroke="#46c9a8" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="180" height="120" fill="none" stroke="#e7eaf0" stroke-width="1.5"/>
    <text x="90" y="150" fill="#e7eaf0" font-size="14" font-weight="600" text-anchor="middle">RepeatWrapping</text>
    <text x="90" y="170" fill="#9aa3b5" font-size="12" text-anchor="middle">the image tiles;</text>
    <text x="90" y="186" fill="#9aa3b5" font-size="12" text-anchor="middle">what you want for floors</text>
  </g>
  <g transform="translate(660 90)">
    <use href="#my"/><use href="#mxy" x="60"/><use href="#my" x="120"/>
    <use href="#tile" y="60"/><use href="#mx" x="60" y="60"/><use href="#tile" x="120" y="60"/>
    <path d="M60 0V120M120 0V120M0 60H180" stroke="#46c9a8" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="180" height="120" fill="none" stroke="#e7eaf0" stroke-width="1.5"/>
    <text x="90" y="150" fill="#e7eaf0" font-size="14" font-weight="600" text-anchor="middle">MirroredRepeatWrapping</text>
    <text x="90" y="170" fill="#9aa3b5" font-size="12" text-anchor="middle">every other copy is flipped,</text>
    <text x="90" y="186" fill="#9aa3b5" font-size="12" text-anchor="middle">so seams always match</text>
  </g>
  <text x="40" y="316" fill="#6b7386" font-size="12">wrapS (u) and wrapT (v) are set separately. Bottom left: the original image, with a yellow top and a blue right edge.</text>
</svg>
