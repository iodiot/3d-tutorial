<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="880" height="460" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">INSIDE A BUFFERGEOMETRY</text>
  <!-- quad: v0 (80,360) v1 (300,360) v2 (80,140) v3 (300,140) -->
  <path d="M80 360L300 360L80 140Z" fill="#7cf5d4" fill-opacity=".16"/>
  <path d="M80 140L300 360L300 140Z" fill="#7aa7ff" fill-opacity=".16"/>
  <path d="M80 360L300 360L300 140L80 140Z" fill="none" stroke="#e7eaf0" stroke-width="2"/>
  <path d="M80 140L300 360" stroke="#e7eaf0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="318" fill="#7cf5d4" font-size="13" font-weight="600">triangle 0, 1, 2</text>
  <text x="196" y="190" fill="#7aa7ff" font-size="13" font-weight="600">triangle 2, 1, 3</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">
    <circle cx="80" cy="360" r="7" fill="#f2cc60"/><text x="60" y="390" fill="#f2cc60">0</text><text x="74" y="408" fill="#9aa3b5" font-size="11">(-1,-1,0)</text>
    <circle cx="300" cy="360" r="7" fill="#f2cc60"/><text x="306" y="390" fill="#f2cc60">1</text><text x="270" y="408" fill="#9aa3b5" font-size="11">(1,-1,0)</text>
    <circle cx="80" cy="140" r="7" fill="#f2cc60"/><text x="60" y="126" fill="#f2cc60">2</text><text x="74" y="108" fill="#9aa3b5" font-size="11">(-1,1,0)</text>
    <circle cx="300" cy="140" r="7" fill="#f2cc60"/><text x="306" y="126" fill="#f2cc60">3</text><text x="270" y="108" fill="#9aa3b5" font-size="11">(1,1,0)</text>
  </g>
  <text x="40" y="438" fill="#6b7386" font-size="12">Counter-clockwise order = front face.</text>
  <!-- attribute table -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">
    <text x="400" y="96" fill="#9aa3b5" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">attribute</text>
    <text x="520" y="96" fill="#9aa3b5" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">vertex 0</text>
    <text x="610" y="96" fill="#9aa3b5" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">vertex 1</text>
    <text x="700" y="96" fill="#9aa3b5" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">vertex 2</text>
    <text x="790" y="96" fill="#9aa3b5" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">vertex 3</text>

    <rect x="390" y="110" width="466" height="48" rx="10" fill="#171b25" stroke="#7aa7ff" stroke-width="1.5"/>
    <text x="402" y="131" fill="#7aa7ff" font-weight="700">position</text><text x="402" y="149" fill="#6b7386" font-size="11">itemSize 3</text>
    <text x="520" y="139" fill="#e7eaf0">-1 -1 0</text><text x="610" y="139" fill="#e7eaf0"> 1 -1 0</text><text x="700" y="139" fill="#e7eaf0">-1  1 0</text><text x="790" y="139" fill="#e7eaf0"> 1  1 0</text>

    <rect x="390" y="170" width="466" height="48" rx="10" fill="#171b25" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="402" y="191" fill="#f2cc60" font-weight="700">normal</text><text x="402" y="209" fill="#6b7386" font-size="11">itemSize 3</text>
    <text x="520" y="199" fill="#e7eaf0"> 0  0 1</text><text x="610" y="199" fill="#e7eaf0"> 0  0 1</text><text x="700" y="199" fill="#e7eaf0"> 0  0 1</text><text x="790" y="199" fill="#e7eaf0"> 0  0 1</text>

    <rect x="390" y="230" width="466" height="48" rx="10" fill="#171b25" stroke="#c79bff" stroke-width="1.5"/>
    <text x="402" y="251" fill="#c79bff" font-weight="700">uv</text><text x="402" y="269" fill="#6b7386" font-size="11">itemSize 2</text>
    <text x="520" y="259" fill="#e7eaf0">0 0</text><text x="610" y="259" fill="#e7eaf0">1 0</text><text x="700" y="259" fill="#e7eaf0">0 1</text><text x="790" y="259" fill="#e7eaf0">1 1</text>

    <rect x="390" y="290" width="466" height="48" rx="10" fill="#12151d" stroke="#3a4258" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="402" y="311" fill="#9aa3b5" font-weight="700">color</text><text x="402" y="329" fill="#6b7386" font-size="11">optional</text>
    <rect x="520" y="306" width="54" height="16" rx="4" fill="#ff4a55"/><rect x="610" y="306" width="54" height="16" rx="4" fill="#38e680"/><rect x="700" y="306" width="54" height="16" rx="4" fill="#4073ff"/><rect x="790" y="306" width="54" height="16" rx="4" fill="#ffcc26"/>

    <rect x="390" y="362" width="466" height="48" rx="10" fill="#0f2a24" stroke="#7cf5d4" stroke-width="1.5"/>
    <text x="402" y="383" fill="#7cf5d4" font-weight="700">index</text><text x="402" y="401" fill="#6b7386" font-size="11">which vertices</text>
    <text x="520" y="392" fill="#e7eaf0">[ 0, 1, 2,   2, 1, 3 ]</text>
  </g>
  <text x="390" y="438" fill="#6b7386" font-size="12">Each attribute is one flat Float32Array; the GPU reads it per vertex.</text>
</svg>
