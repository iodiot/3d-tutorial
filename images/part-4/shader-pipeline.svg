<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2cc60"/></marker>
  </defs>
  <rect width="880" height="400" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">THE SHADER PIPELINE: ONE DRAW CALL</text>

  <!-- uniforms bar -->
  <rect x="150" y="70" width="560" height="40" rx="10" fill="#f2cc60" fill-opacity=".12" stroke="#f2cc60" stroke-width="1.5"/>
  <text x="430" y="95" fill="#f2cc60" font-size="14" font-weight="600" text-anchor="middle">uniforms: the same value for every vertex and pixel (uTime, uColor…)</text>
  <path d="M260 110V160" stroke="#f2cc60" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#y)"/>
  <path d="M600 110V160" stroke="#f2cc60" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#y)"/>

  <!-- boxes -->
  <g font-size="14">
    <rect x="30" y="166" width="140" height="124" rx="12" fill="#1b2030" stroke="#4a5163" stroke-width="1.5"/>
    <text x="100" y="192" fill="#e7eaf0" font-weight="700" text-anchor="middle">Geometry</text>
    <text x="100" y="216" fill="#9aa3b5" font-size="12" text-anchor="middle">attributes, per vertex:</text>
    <text x="100" y="238" fill="#c79bff" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">position</text>
    <text x="100" y="256" fill="#c79bff" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">normal</text>
    <text x="100" y="274" fill="#c79bff" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">uv</text>

    <rect x="190" y="166" width="140" height="124" rx="12" fill="#1b2030" stroke="#7cf5d4" stroke-width="2"/>
    <text x="260" y="192" fill="#7cf5d4" font-weight="700" text-anchor="middle">Vertex shader</text>
    <text x="260" y="216" fill="#e7eaf0" font-size="12" text-anchor="middle">runs once per vertex</text>
    <text x="260" y="238" fill="#9aa3b5" font-size="12" text-anchor="middle">moves the point,</text>
    <text x="260" y="256" fill="#9aa3b5" font-size="12" text-anchor="middle">writes</text>
    <text x="260" y="274" fill="#7cf5d4" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">gl_Position</text>

    <rect x="350" y="166" width="160" height="124" rx="12" fill="#1b2030" stroke="#4a5163" stroke-width="1.5"/>
    <text x="430" y="192" fill="#e7eaf0" font-weight="700" text-anchor="middle">Rasterizer</text>
    <text x="430" y="210" fill="#9aa3b5" font-size="12" text-anchor="middle">fixed hardware, not code</text>
    <path d="M384 276L476 276L430 222Z" fill="#c79bff" fill-opacity=".15" stroke="#c79bff" stroke-width="1.5"/>
    <g fill="#e7eaf0">
      <circle cx="418" cy="262" r="2.2"/><circle cx="430" cy="262" r="2.2"/><circle cx="442" cy="262" r="2.2"/><circle cx="406" cy="268" r="2.2"/><circle cx="454" cy="268" r="2.2"/>
      <circle cx="424" cy="250" r="2.2"/><circle cx="436" cy="250" r="2.2"/><circle cx="430" cy="238" r="2.2"/><circle cx="418" cy="268" r="2.2"/><circle cx="430" cy="268" r="2.2"/><circle cx="442" cy="268" r="2.2"/>
    </g>

    <rect x="530" y="166" width="140" height="124" rx="12" fill="#1b2030" stroke="#ff7a85" stroke-width="2"/>
    <text x="600" y="192" fill="#ff7a85" font-weight="700" text-anchor="middle">Fragment shader</text>
    <text x="600" y="216" fill="#e7eaf0" font-size="12" text-anchor="middle">runs once per pixel</text>
    <text x="600" y="238" fill="#9aa3b5" font-size="12" text-anchor="middle">the triangle covers,</text>
    <text x="600" y="256" fill="#9aa3b5" font-size="12" text-anchor="middle">writes a colour to</text>
    <text x="600" y="274" fill="#ff7a85" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">gl_FragColor</text>

    <rect x="690" y="166" width="160" height="124" rx="12" fill="#1b2030" stroke="#4a5163" stroke-width="1.5"/>
    <text x="770" y="192" fill="#e7eaf0" font-weight="700" text-anchor="middle">Screen</text>
    <text x="770" y="210" fill="#9aa3b5" font-size="12" text-anchor="middle">depth test, blending</text>
    <g stroke="#12151d" stroke-width="1">
      <rect x="730" y="222" width="20" height="20" fill="#2a3142"/><rect x="750" y="222" width="20" height="20" fill="#ff7a3d"/><rect x="770" y="222" width="20" height="20" fill="#ff7a3d"/><rect x="790" y="222" width="20" height="20" fill="#2a3142"/>
      <rect x="730" y="242" width="20" height="20" fill="#ff7a3d"/><rect x="750" y="242" width="20" height="20" fill="#ffb07a"/><rect x="770" y="242" width="20" height="20" fill="#ffb07a"/><rect x="790" y="242" width="20" height="20" fill="#ff7a3d"/>
      <rect x="730" y="262" width="20" height="20" fill="#2a3142"/><rect x="750" y="262" width="20" height="20" fill="#ff7a3d"/><rect x="770" y="262" width="20" height="20" fill="#ff7a3d"/><rect x="790" y="262" width="20" height="20" fill="#2a3142"/>
    </g>
  </g>
  <g stroke="#9aa3b5" stroke-width="1.5">
    <path d="M170 228H188" marker-end="url(#g)"/><path d="M330 228H348" marker-end="url(#g)"/><path d="M510 228H528" marker-end="url(#g)"/><path d="M670 228H688" marker-end="url(#g)"/>
  </g>

  <!-- varyings -->
  <path d="M260 290V322H600V292" fill="none" stroke="#c79bff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#y)"/>
  <text x="430" y="342" fill="#c79bff" font-size="13" font-weight="600" text-anchor="middle">varyings (vUv, vNormal…): written per vertex, blended across the triangle, read per pixel</text>
  <text x="32" y="378" fill="#6b7386" font-size="12">A few thousand vertices, a few million pixels: the fragment shader usually does most of the work.</text>
</svg>
