  <rect x="376" y="294" width="300" height="70" rx="12" fill="#1b2030" stroke="#ff6fae" stroke-width="2" />
  <text x="394" y="320" fill="#ff6fae" font-size="15" font-weight="700" text-anchor="start">tone mapping + sRGB</text>
  <text x="394" y="344" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">OutputPass / renderOutput(): last</text>
  <text x="700" y="316" fill="#e7eaf0" font-size="12" font-weight="400" text-anchor="start">UnrealBloomPass (WebGL)</text>
  <text x="700" y="334" fill="#e7eaf0" font-size="12" font-weight="400" text-anchor="start">bloom() node (WebGPU)</text>
  <text x="700" y="352" fill="#e7eaf0" font-size="12" font-weight="400" text-anchor="start">both follow these steps</text>

