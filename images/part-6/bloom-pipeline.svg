  <rect x="580.16" y="141" width="33.48" height="54" rx="5" fill="#2b2134" stroke="#a98bff" stroke-width="1.5"/>
  <text x="596.9" y="209" fill="#9aa3b5" font-size="10.5" font-weight="400" text-anchor="middle">⅛</text>
  <line x1="615.64" y1="168" x2="627.64" y2="168" stroke="#9aa3b5" stroke-width="2" marker-end="url(#g)"/>
  <rect x="631.64" y="148" width="24.8" height="40" rx="5" fill="#2b2134" stroke="#a98bff" stroke-width="1.5"/>
  <text x="644.04" y="202" fill="#9aa3b5" font-size="10.5" font-weight="400" text-anchor="middle">1/16</text>
  <line x1="658.4399999999999" y1="168" x2="670.4399999999999" y2="168" stroke="#9aa3b5" stroke-width="2" marker-end="url(#g)"/>
  <rect x="674.4399999999999" y="153" width="18.6" height="30" rx="5" fill="#2b2134" stroke="#a98bff" stroke-width="1.5"/>
  <text x="683.7399999999999" y="197" fill="#9aa3b5" font-size="10.5" font-weight="400" text-anchor="middle">1/32</text>
  <line x1="770" y1="150" x2="806" y2="150" stroke="#9aa3b5" stroke-width="2" marker-end="url(#g)"/>
  <rect x="810" y="90" width="150" height="120" rx="12" fill="#1b2030" stroke="#a98bff" stroke-width="2" />
  <text x="828" y="116" fill="#a98bff" font-size="15" font-weight="700" text-anchor="start">combine</text>
  <text x="828" y="140" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">weighted sum of the</text>
  <text x="828" y="157" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">mips, shaped by radius,</text>
  <text x="828" y="174" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">× strength</text>
  <path d="M885 214 V262 H110 V290" fill="none" stroke="#9aa3b5" stroke-width="2" marker-end="url(#g)"/>
  <text x="500" y="256" fill="#9aa3b5" font-size="11" font-weight="400" text-anchor="middle">small mips = wide, soft halo · big mips = tight core</text>
  <rect x="32" y="294" width="300" height="70" rx="12" fill="#1b2030" stroke="#7cf5d4" stroke-width="2" />
  <text x="50" y="320" fill="#7cf5d4" font-size="15" font-weight="700" text-anchor="start">scene + glow</text>
  <text x="50" y="344" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">added on top, still in HDR</text>
