<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b5"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7cf5d4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6fae"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6fd8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb35c"/></marker></defs>
  <rect width="940" height="410" rx="18" fill="#12151d"/>
  <text x="32" y="44" fill="#7cf5d4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2">A RENDER TARGET: DRAW INTO A TEXTURE FIRST</text>
  <rect x="32" y="96" width="200" height="200" rx="12" fill="#1b2030" stroke="#6fd8ff" stroke-width="2" />
  <text x="50" y="122" fill="#6fd8ff" font-size="15" font-weight="700" text-anchor="start">scene + camera</text>
  <text x="50" y="148" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">the usual scene graph:</text>
  <text x="50" y="165" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">meshes, lights, materials</text>
  <text x="50" y="200" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">renderer</text>
  <text x="50" y="217" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">  .setRenderTarget(target)</text>
  <text x="50" y="234" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">renderer</text>
  <text x="50" y="251" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">  .render(scene, camera)</text>
  <line x1="236" y1="196" x2="300" y2="196" stroke="#6fd8ff" stroke-width="2" marker-end="url(#c)"/>
  <text x="268" y="184" fill="#6fd8ff" font-size="11" font-weight="700" text-anchor="middle">pass 1</text>
  <rect x="304" y="86" width="236" height="220" rx="12" fill="#1b2030" stroke="#7cf5d4" stroke-width="2" />
  <text x="322" y="112" fill="#7cf5d4" font-size="15" font-weight="700" text-anchor="start">render target</text>
  <text x="322" y="136" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">a texture you can draw into</text>
  <rect x="322" y="150" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="322" y="168" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="322" y="186" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="322" y="204" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="354" y="150" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="354" y="168" width="30" height="16" rx="2" fill="#3b2747"/>
  <rect x="354" y="186" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="354" y="204" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="386" y="150" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="386" y="168" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="386" y="186" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="386" y="204" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="418" y="150" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="418" y="168" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="418" y="186" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="418" y="204" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="450" y="150" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="450" y="168" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="450" y="186" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="450" y="204" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="482" y="150" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="482" y="168" width="30" height="16" rx="2" fill="#2a3350"/>
  <rect x="482" y="186" width="30" height="16" rx="2" fill="#222a3f"/>
  <rect x="482" y="204" width="30" height="16" rx="2" fill="#222a3f"/>
  <text x="422" y="196" fill="#ffb35c" font-size="11" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.0, 0.9, 4.2 …</text>
  <text x="322" y="246" fill="#e7eaf0" font-size="11.5" font-weight="400" text-anchor="start">colour: width × height pixels</text>
  <text x="322" y="263" fill="#e7eaf0" font-size="11.5" font-weight="400" text-anchor="start">HalfFloat: values above 1.0 survive</text>
  <text x="322" y="280" fill="#e7eaf0" font-size="11.5" font-weight="400" text-anchor="start">depth buffer, optional MSAA samples</text>
  <line x1="544" y1="196" x2="608" y2="196" stroke="#7cf5d4" stroke-width="2" marker-end="url(#m)"/>
  <text x="576" y="184" fill="#7cf5d4" font-size="11" font-weight="700" text-anchor="middle">pass 2</text>
  <rect x="612" y="96" width="296" height="200" rx="12" fill="#1b2030" stroke="#ff6fae" stroke-width="2" />
  <text x="630" y="122" fill="#ff6fae" font-size="15" font-weight="700" text-anchor="start">full-screen quad</text>
  <text x="630" y="148" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">two triangles covering the screen;</text>
  <text x="630" y="165" fill="#9aa3b5" font-size="11.5" font-weight="400" text-anchor="start">its fragment shader runs once per pixel</text>
  <text x="630" y="196" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">renderer.setRenderTarget(null)</text>
  <text x="630" y="213" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">renderer.render(quadScene, cam)</text>
  <text x="630" y="230" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace"></text>
  <text x="630" y="247" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">color = texture2D(tDiffuse, vUv)</text>
  <text x="630" y="264" fill="#e7eaf0" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">// …change it, then output</text>
  <rect x="612" y="312" width="296" height="40" rx="10" fill="#0b0d13" stroke="#6b7386" stroke-width="1.5"/>
  <text x="760" y="337" fill="#e7eaf0" font-size="12" font-weight="400" text-anchor="middle">the canvas: what you see</text>
  <line x1="760" y1="296" x2="760" y2="310" stroke="#ff6fae" stroke-width="2" marker-end="url(#p)"/>
  <text x="32" y="384" fill="#9aa3b5" font-size="12.5" font-weight="400" text-anchor="start">Every post-processing effect is this, repeated: render to a texture, then run a shader over that texture.</text>

</svg>
