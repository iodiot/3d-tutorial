<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 6 · A TSL preview: the same waves on WebGPURenderer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
    .panel { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 48px); font: 400 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #e7eaf0; background: rgba(18, 21, 29, .85); border: 1px solid #3a4258; border-radius: 8px; padding: 8px 11px; white-space: pre; overflow: hidden; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status" class="panel">Starting WebGPURenderer…</div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { positionLocal, time, sin, mix, smoothstep, uniform, varying, vec3 } from 'three/tsl';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f2a);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.6, 4.2);

    // WebGPU if the browser has it, WebGL 2 if not. The material below works on both.
    const renderer = new THREE.WebGPURenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // The waves from step 3, written in TSL: JavaScript functions that build a shader graph
    const amplitude = uniform(0.25);
    const frequency = uniform(3.0);
    const deep = uniform(new THREE.Color('#0b3d91'));
    const crest = uniform(new THREE.Color('#7cf5d4'));

    const elevation = sin(positionLocal.x.mul(frequency).add(time)).mul(0.5)
      .add(sin(positionLocal.y.mul(frequency).mul(0.8).add(time.mul(1.3))).mul(0.5))
      .mul(amplitude);

    const material = new THREE.MeshBasicNodeMaterial();
    material.positionNode = positionLocal.add(vec3(0, 0, elevation));            // vertex stage
    const vElevation = varying(elevation);                                          // passed on, like a GLSL varying
    material.colorNode = mix(deep, crest, smoothstep(amplitude.negate(), amplitude, vElevation));   // fragment stage

    const water = new THREE.Mesh(new THREE.PlaneGeometry(4, 4, 128, 128), material);
    water.rotation.x = -Math.PI / 2;
    scene.add(water);

    const backend = renderer.backend.isWebGPUBackend ? 'WebGPU (shaders compiled to WGSL)' : 'WebGL 2 fallback (shaders compiled to GLSL)';
    status.textContent = `TSL + WebGPURenderer\nrunning on: ${backend}`;

    const gui = new GUI({ title: 'Step 6 TSL preview' });
    gui.add(amplitude, 'value', 0, 0.6, 0.01).name('amplitude');
    gui.add(frequency, 'value', 0.2, 6, 0.05).name('frequency');

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
