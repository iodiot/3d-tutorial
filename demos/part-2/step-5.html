<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 5 · UV coordinates and a test texture</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f2a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.3, 4.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // A UV test grid: every cell is labelled, A1 is the (0, 0) corner
    const loader = new THREE.TextureLoader();
    const uvGrid = loader.load('textures/uv-grid.png');
    uvGrid.colorSpace = THREE.SRGBColorSpace; // explained in the next section

    const material = new THREE.MeshStandardMaterial({ map: uvGrid, roughness: 0.6 });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), material);
    plane.position.x = -2;
    scene.add(plane);

    const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), material);
    box.rotation.set(0.4, 0.7, 0);
    scene.add(box);

    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.75, 64, 32), material);
    sphere.position.x = 2;
    scene.add(sphere);

    const grid = new THREE.GridHelper(10, 20, 0x3a4258, 0x262c3b);
    grid.position.y = -1.3;
    scene.add(grid);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(3, 4, 2);
    scene.add(sun);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    renderer.setAnimationLoop((time) => {
      sphere.rotation.y = time * 0.0003;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
<script data-goatcounter="https://iodiot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
