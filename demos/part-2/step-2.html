<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 2 · Normals: flat and smooth</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
    .label { font: 600 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #e7eaf0; background: rgba(18, 21, 29, .85); border: 1px solid #3a4258; border-radius: 8px; padding: 4px 9px; text-align: center; white-space: nowrap; }
    .label small { display: block; font: 400 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #9aa3b5; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f2a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Labels are plain HTML elements that follow 3D positions
    const labels = new CSS2DRenderer();
    labels.setSize(innerWidth, innerHeight);
    labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    document.body.appendChild(labels.domElement);

    function label(html, x, y, z) {
      const div = document.createElement('div');
      div.className = 'label';
      div.innerHTML = html;
      const obj = new CSS2DObject(div);
      obj.position.set(x, y, z);
      scene.add(obj);
    }

    const material = new THREE.MeshStandardMaterial({ color: 0x3fc8a8, roughness: 0.45 });

    // Smooth: an indexed sphere, neighbouring faces share vertices and normals
    const smoothGeometry = new THREE.SphereGeometry(0.9, 16, 10);

    // Flat: the same sphere, but every triangle gets its own three vertices,
    // so computeVertexNormals() gives each face a single normal
    const flatGeometry = smoothGeometry.toNonIndexed();
    flatGeometry.computeVertexNormals();

    const flat = new THREE.Mesh(flatGeometry, material);
    flat.position.x = -1.2;
    scene.add(flat);

    const smooth = new THREE.Mesh(smoothGeometry, material);
    smooth.position.x = 1.2;
    scene.add(smooth);

    const flatHelper = new VertexNormalsHelper(flat, 0.18, 0xf2cc60);
    const smoothHelper = new VertexNormalsHelper(smooth, 0.18, 0xf2cc60);
    scene.add(flatHelper, smoothHelper);

    label(`flat<small>${flatGeometry.attributes.position.count} vertices</small>`, -1.2, -1.35, 0);
    label(`smooth<small>${smoothGeometry.attributes.position.count} vertices</small>`, 1.2, -1.35, 0);

    const grid = new THREE.GridHelper(10, 20, 0x3a4258, 0x262c3b);
    grid.position.y = -1.3;
    scene.add(grid);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(3, 4, 2);
    scene.add(sun);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      labels.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    renderer.setAnimationLoop((time) => {
      flat.rotation.y = smooth.rotation.y = time * 0.0003;
      flatHelper.update();
      smoothHelper.update();
      controls.update();
      renderer.render(scene, camera);
      labels.render(scene, camera);
    });
  </script>
<script data-goatcounter="https://iodiot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
