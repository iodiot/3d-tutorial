<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 4 · Roughness and metalness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
    .label { font: 600 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #e7eaf0; background: rgba(18, 21, 29, .85); border: 1px solid #3a4258; border-radius: 8px; padding: 4px 9px; text-align: center; white-space: nowrap; }
    .label small { display: block; font: 400 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #9aa3b5; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // Open step-4.html?env=0 to see the same spheres without an environment
    const useEnvironment = new URLSearchParams(location.search).get('env') !== '0';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f2a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 5.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const labels = new CSS2DRenderer();
    labels.setSize(innerWidth, innerHeight);
    labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    document.body.appendChild(labels.domElement);

    function label(html, x, y) {
      const div = document.createElement('div');
      div.className = 'label';
      div.innerHTML = html;
      const obj = new CSS2DObject(div);
      obj.position.set(x, y, 0);
      scene.add(obj);
    }

    if (useEnvironment) {
      // Something for the surfaces to reflect. Part 3 covers environments properly.
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.3;
    } else {
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    }

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(3, 4, 2);
    scene.add(sun);

    const geometry = new THREE.SphereGeometry(0.5, 64, 32);
    const roughnessValues = [0, 0.25, 0.5, 0.75, 1];

    [0, 1].forEach((metalness, row) => {
      roughnessValues.forEach((roughness, col) => {
        const material = new THREE.MeshStandardMaterial({ color: 0x3fc8a8, metalness, roughness });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set((col - 2) * 1.3, row === 0 ? 0.75 : -0.75, 0);
        scene.add(mesh);
      });
      label(`metalness<small>${metalness}</small>`, -3.8, row === 0 ? 0.75 : -0.75);
    });
    roughnessValues.forEach((roughness, col) => label(`roughness<small>${roughness}</small>`, (col - 2) * 1.3, -1.6));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      labels.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      labels.render(scene, camera);
    });
  </script>
</body>
</html>
