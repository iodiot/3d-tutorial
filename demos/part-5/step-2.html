<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 2 · The node material family</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    .panel { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 48px); font: 400 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #e7eaf0; background: rgba(18, 21, 29, .85); border: 1px solid #3a4258; border-radius: 8px; padding: 8px 11px; white-space: pre; overflow: hidden; }
    .panel a { color: #7cf5d4; }
    .hint { position: absolute; left: 12px; bottom: 12px; font: 400 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #9aa3b5; pointer-events: none; }
    .label { position: absolute; transform: translate(-50%, 0); font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #e7eaf0; background: rgba(18, 21, 29, .8); border: 1px solid #3a4258; border-radius: 6px; padding: 3px 7px; white-space: nowrap; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status" class="panel">Starting WebGPURenderer…</div>
  <div class="hint">Drag to orbit · same light, same sphere, seven materials</div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f2a);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 7.2);

    // WebGPU if the browser has it, WebGL 2 if not. ?backend=webgl forces the fallback.
    const params = new URLSearchParams(location.search);
    const status = document.getElementById('status');

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: params.get('backend') === 'webgl' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    try {
      await renderer.init();   // async: asks the browser for a GPU device, or falls back
    } catch (error) {
      status.textContent = 'Sorry: this browser has neither WebGPU nor WebGL 2.\n' + error.message;
      throw error;
    }
    const isWebGPU = renderer.backend.isWebGPUBackend === true;
    const backendName = isWebGPU ? 'WebGPU (TSL compiled to WGSL)' : 'WebGL 2 fallback (TSL compiled to GLSL)';
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // One entry per material: a label and a ready-made material.
    // The first six are node materials. The last one is a classic Part 3 material:
    // WebGPURenderer swaps it for its node twin behind the scenes.
    const color = '#ff8a4c';
    const entries = [
      ['Basic',    new THREE.MeshBasicNodeMaterial({ color })],
      ['Lambert',  new THREE.MeshLambertNodeMaterial({ color })],
      ['Phong',    new THREE.MeshPhongNodeMaterial({ color, shininess: 80 })],
      ['Standard', new THREE.MeshStandardNodeMaterial({ color, roughness: 0.3, metalness: 0.1 })],
      ['Physical', new THREE.MeshPhysicalNodeMaterial({ color, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05 })],
      ['Toon',     new THREE.MeshToonNodeMaterial({ color })],
      ['classic Standard', new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.1 })],
    ];

    const geometry = new THREE.SphereGeometry(0.58, 48, 32);
    const labels = [];
    entries.forEach(([name, material], i) => {
      const sphere = new THREE.Mesh(geometry, material);
      sphere.position.x = (i - (entries.length - 1) / 2) * 1.3;
      scene.add(sphere);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = name;
      document.body.appendChild(label);
      labels.push({ label, anchor: sphere.position.clone().setY(-0.9) });
    });

    const sun = new THREE.DirectionalLight(0xffffff, 3);
    sun.position.set(3, 4, 4);
    scene.add(sun, new THREE.HemisphereLight(0x9ec5ff, 0x1b1f2a, 1.2));

    status.textContent = 'Seven materials, one light\nrunning on: ' + backendName;

    const gui = new GUI({ title: 'Step 2' });
    const settings = { roughness: 0.3, spin: true };
    gui.add(settings, 'roughness', 0, 1, 0.01).onChange((v) => {
      for (const [name, material] of entries) if (name === 'Standard' || name === 'Physical' || name === 'classic Standard') material.roughness = v;
    });
    gui.add(settings, 'spin');
    if (innerWidth < 700) gui.close();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const point = new THREE.Vector3();
    renderer.setAnimationLoop((time) => {
      if (settings.spin) scene.children.forEach((child) => { if (child.isMesh) child.rotation.y = time / 3000; });
      controls.update();
      renderer.render(scene, camera);

      // keep the HTML labels under their spheres
      for (const { label, anchor } of labels) {
        point.copy(anchor).project(camera);
        label.style.left = ((point.x + 1) / 2 * innerWidth) + 'px';
        label.style.top = ((1 - point.y) / 2 * innerHeight) + 'px';
      }
    });
  </script>
</body>
</html>
