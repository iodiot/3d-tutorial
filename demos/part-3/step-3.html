<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 3 · Environment lighting: none, RoomEnvironment, HDR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import GUI from 'three/addons/libs/lil-gui.module.min.js';

    const params = new URLSearchParams(location.search);

    const scene = new THREE.Scene();
    const backgroundColor = new THREE.Color(0x1b1f2a);
    scene.background = backgroundColor;

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0.6, 1.3, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.6, 0);
    controls.enableDamping = true;

    // No lights in this scene at all. Everything you see comes from scene.environment.

    // Two environments to choose from
    // 1. RoomEnvironment: a small procedural room, pre-filtered by PMREMGenerator
    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomTexture = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // 2. A real HDR photo of the sky and ground (equirectangular, 2:1)
    const hdrTexture = await new HDRLoader().loadAsync('textures/rosendal_plains_2_1k.hdr');
    hdrTexture.mapping = THREE.EquirectangularReflectionMapping;

    // The fox, plus a chrome ball and a rough white ball either side of it
    const gltf = await new GLTFLoader().loadAsync('models/Fox.glb');
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
    box.setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.set(-center.x, -box.min.y, -center.z);
    model.rotation.y = 0.5;
    scene.add(model);

    const ballGeometry = new THREE.SphereGeometry(0.4, 64, 32);
    const chrome = new THREE.Mesh(ballGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05 }));
    chrome.position.set(-1.5, 0.4, 0);
    const matte = new THREE.Mesh(ballGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0, roughness: 0.6 }));
    matte.position.set(1.5, 0.4, 0);
    scene.add(chrome, matte);

    const settings = {
      environment: params.get('env') || 'room',
      background: params.get('bg') === '1',
      blurriness: Number(params.get('blur') || 0),
      intensity: 1,
    };

    function apply() {
      const env = { none: null, room: roomTexture, hdr: hdrTexture }[settings.environment];
      scene.environment = env;                       // lights the PBR materials
      scene.environmentIntensity = settings.intensity;
      // Only the HDR is worth looking at, so only it can be the background
      scene.background = settings.background && settings.environment === 'hdr' ? hdrTexture : backgroundColor;
      scene.backgroundBlurriness = settings.blurriness;
    }
    apply();

    const gui = new GUI({ title: 'Environment' });
    gui.add(settings, 'environment', ['none', 'room', 'hdr']).onChange(apply);
    gui.add(settings, 'background').name('HDR as background').onChange(apply);
    gui.add(settings, 'blurriness', 0, 1, 0.01).name('backgroundBlurriness').onChange(apply);
    gui.add(settings, 'intensity', 0, 3, 0.05).name('environmentIntensity').onChange(apply);

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
<script data-goatcounter="https://iodiot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
