<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 4 · Tone mapping compared: None, ACES Filmic, AgX, Neutral</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { display: block; }
    #names { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; pointer-events: none; }
    #names div { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; border: 1px solid rgba(0, 0, 0, .6); }
    #names span { font: 600 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #e7eaf0; background: rgba(18, 21, 29, .85); border: 1px solid #3a4258; border-radius: 8px; padding: 4px 9px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="names"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
    import GUI from 'three/addons/libs/lil-gui.module.min.js';

    const params = new URLSearchParams(location.search);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0.9, 1.0, 3.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMappingExposure = Number(params.get('exposure') || 1);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    controls.enableDamping = true;

    // A bright scene: the HDR sky for light and background, plus a strong sun
    const hdrTexture = await new HDRLoader().loadAsync('textures/rosendal_plains_2_1k.hdr');
    hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = hdrTexture;
    scene.background = hdrTexture;
    scene.backgroundBlurriness = 0.15;

    const sun = new THREE.DirectionalLight(0xfff2dd, 4);
    sun.position.set(2, 4, 3);
    scene.add(sun);

    const gltf = await new GLTFLoader().loadAsync('models/Fox.glb');
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
    box.setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.set(-center.x, -box.min.y, -center.z);
    model.rotation.y = 0.9;
    scene.add(model);

    // A white ball and an orange ball: the easiest places to see highlights clip
    const ballGeometry = new THREE.SphereGeometry(0.35, 64, 32);
    const white = new THREE.Mesh(ballGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 }));
    white.position.set(-1.2, 0.35, -0.4);
    const orange = new THREE.Mesh(ballGeometry, new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.35 }));
    orange.position.set(1.3, 0.35, 0.2);
    scene.add(white, orange);

    // Four tone mappers. Each one renders the same view into its own quarter of the canvas.
    const modes = [
      ['NoToneMapping', THREE.NoToneMapping],
      ['ACESFilmicToneMapping', THREE.ACESFilmicToneMapping],
      ['AgXToneMapping', THREE.AgXToneMapping],
      ['NeutralToneMapping', THREE.NeutralToneMapping],
    ];
    document.getElementById('names').innerHTML = modes.map(([name]) => `<div><span>${name.replace('ToneMapping', '')}</span></div>`).join('');

    const gui = new GUI({ title: 'Tone mapping' });
    gui.add(renderer, 'toneMappingExposure', 0, 3, 0.05).name('exposure');

    function onResize() {
      camera.aspect = innerWidth / innerHeight;   // each quarter has the same aspect as the window
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    renderer.setScissorTest(true);

    renderer.setAnimationLoop(() => {
      controls.update();
      const w = innerWidth / 2;
      const h = innerHeight / 2;
      modes.forEach(([, mode], i) => {
        // Viewport and scissor are measured from the bottom-left corner, in CSS pixels
        const x = (i % 2) * w;
        const y = i < 2 ? h : 0;
        renderer.setViewport(x, y, w, h);
        renderer.setScissor(x, y, w, h);
        renderer.toneMapping = mode;
        renderer.render(scene, camera);
      });
    });
  </script>
<script data-goatcounter="https://iodiot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
